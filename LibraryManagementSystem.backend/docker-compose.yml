version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: catalog_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: catalogdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalogdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: catalog_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: 1234
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  catalogservice:
    build:
      context: .
      dockerfile: services/catalogService/Presentation/Dockerfile
    container_name: catalog_service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=1234"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
